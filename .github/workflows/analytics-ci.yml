name: Analytics CI

on:
  push:
    paths:
      - "services/analytics/**"
      - ".github/workflows/analytics-ci.yml"
  pull_request:
    paths:
      - "services/analytics/**"
      - ".github/workflows/analytics-ci.yml"

jobs:
  test:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: services/analytics
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          python-version: "3.13"
      - run: uv sync --group dev
      - run: uv run ruff check .
      - run: uv run pytest

[project]
name = "riftpilot-analytics"
version = "0.1.0"
description = "Local analytics service for the RiftPilot desktop application."
readme = "README.md"
requires-python = ">=3.13,<3.14"
dependencies = [
  "fastapi",
  "httpx",
  "uvicorn[standard]",
]

[dependency-groups]
dev = [
  "pytest",
  "pytest-cov",
  "ruff",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/riftpilot_analytics"]

[tool.pytest.ini_options]
addopts = [
  "--cov=riftpilot_analytics",
  "--cov-report=term-missing",
  "--cov-fail-under=90",
]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py313"

[tool.ruff.lint]
select = ["B", "E", "F", "I", "SIM", "UP"]
